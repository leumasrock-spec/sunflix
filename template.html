<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunflix – Vídeos de estudo do Prof. Samuel Rocha</title>
<meta name="description" content="Sunflix: vídeos de Biologia, Ciências e Direito Ambiental organizados por categoria, do Prof. Samuel Rocha.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1f26;--bg2:#0f2e38;--teal:#123c47;--teal2:#1b7a85;--aqua:#3fc1c9;--sun:#f2a33a;--sun2:#ffcc4d;--txt:#eef7f8;--mut:#9fbfc5}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Source Sans 3',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:22px;padding:14px 4vw;background:linear-gradient(180deg,#071a20f0,#071a2000);transition:background .3s}
header.solid{background:#071a20f5;box-shadow:0 4px 20px #0008}
.logo{font-family:Merriweather,serif;font-weight:900;font-size:30px;letter-spacing:2px;color:var(--sun);text-shadow:0 0 18px #f2a33a66;display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo span{font-size:28px;animation:spin 18s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
nav.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:14px;font-weight:600;color:var(--mut);padding:6px 12px;border-radius:20px;border:1px solid transparent;transition:.2s}
.chip:hover{color:#fff;border-color:var(--teal2);background:#1b7a8533}
.search{position:relative}
.search input{width:230px;background:#0008;border:1px solid #3fc1c955;color:#fff;padding:9px 14px 9px 36px;border-radius:24px;font:inherit;font-size:15px;outline:none;transition:.25s}
.search input:focus{border-color:var(--sun);width:280px;background:#000b}
.search:before{content:'🔍';position:absolute;left:12px;top:8px;font-size:14px}
.hero{position:relative;height:78vh;min-height:460px;display:flex;align-items:flex-end;padding:0 4vw 9vh;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.08);transition:opacity .9s,transform 8s ease-out;filter:saturate(1.1)}
.hero .bg.on{transform:scale(1)}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0a1f26f5 0%,#0a1f26c0 38%,#0a1f2610 75%),linear-gradient(0deg,var(--bg) 0%,#0a1f2600 40%)}
.hero .info{position:relative;z-index:2;max-width:640px}
.kicker{color:var(--sun);font-weight:800;letter-spacing:3px;font-size:13px;text-transform:uppercase}
.hero h1{font-family:Merriweather,serif;font-size:clamp(28px,4.2vw,54px);line-height:1.12;margin:12px 0 10px;text-shadow:0 3px 18px #000a}
.hero p{color:#cfe3e6;font-size:18px;margin-bottom:22px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:12px 26px;border-radius:8px;transition:.2s}
.btn.play{background:var(--sun);color:#1b1205}.btn.play:hover{background:var(--sun2);transform:translateY(-2px)}
.btn.more{background:#ffffff26;backdrop-filter:blur(6px)}.btn.more:hover{background:#ffffff40}
.dots{position:absolute;right:4vw;bottom:10vh;z-index:3;display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:#ffffff40;cursor:pointer}.dots i.on{background:var(--sun)}
.stats{display:flex;gap:18px;margin-top:18px;color:var(--mut);font-size:14px;font-weight:600}
main{position:relative;z-index:3;margin-top:-6vh;padding-bottom:40px}
.row{margin:0 0 34px}
.row h2{font-family:Merriweather,serif;font-size:21px;padding:0 4vw;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.row h2 small{font-family:'Source Sans 3';font-weight:600;font-size:13px;color:var(--mut)}
.row h2 a.yt{font-family:'Source Sans 3';font-size:13px;color:var(--aqua);opacity:0;transition:.2s;margin-left:4px}
.row:hover h2 a.yt{opacity:1}
.track-wrap{position:relative}
.track{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:14px 4vw 22px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:14px;bottom:22px;width:4vw;min-width:38px;z-index:5;border:0;background:#071a20b0;color:#fff;font-size:34px;cursor:pointer;opacity:0;transition:.2s}
.track-wrap:hover .arrow{opacity:1}.arrow:hover{background:#071a20e0;color:var(--sun)}
.arrow.l{left:0}.arrow.r{right:0}
.card{flex:0 0 auto;width:250px;border-radius:8px;overflow:hidden;background:var(--bg2);position:relative;transition:transform .28s,box-shadow .28s;box-shadow:0 4px 14px #0006}
.card:hover{transform:scale(1.12);z-index:4;box-shadow:0 14px 34px #000c,0 0 0 2px var(--sun)}
.card .th{aspect-ratio:16/9;width:100%;display:block;object-fit:cover;background:#123c47}
.card .num{position:absolute;top:6px;left:6px;background:#000a;color:var(--sun2);font-weight:800;font-size:12px;padding:2px 7px;border-radius:4px}
.card .pl{position:absolute;top:calc(250px*9/16/2 - 22px);left:calc(50% - 22px);width:44px;height:44px;border-radius:50%;background:var(--sun);color:#1b1205;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:0;transform:scale(.6);transition:.25s}
.card:hover .pl{opacity:1;transform:scale(1)}
.card .meta{padding:8px 10px 10px}
.card .t{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.card .c{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:10px 4vw}
.lk{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:linear-gradient(135deg,#123c47,#0f2e38);border:1px solid #3fc1c933;font-weight:700;transition:.2s}
.lk:hover{border-color:var(--sun);transform:translateY(-3px);box-shadow:0 8px 20px #0008}
.lk .ic{font-size:26px}.lk .s{display:block;font-size:12px;color:var(--mut);font-weight:600}
.empty{padding:40px 4vw;color:var(--mut);font-size:18px;display:none}
footer{padding:30px 4vw 40px;color:var(--mut);font-size:14px;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{color:var(--sun)}
@media(max-width:760px){nav.chips{display:none}.search input{width:150px}.search input:focus{width:180px}.card{width:200px}.card .pl{top:calc(200px*9/16/2 - 22px)}.hero{height:66vh}.logo{font-size:24px}}
</style>
</head>
<body>
<header id="hd"><a class="logo" href="#"><span>🌻</span>SUNFLIX</a><nav class="chips" id="chips"></nav><label class="search"><input id="q" type="search" placeholder="Buscar vídeo ou tema..." aria-label="Buscar"></label></header>
<section class="hero" id="hero"><div class="bg" id="bgA"></div><div class="bg" id="bgB" style="opacity:0"></div>
 <div class="info"><div class="kicker" id="hk"></div><h1 id="ht"></h1><p id="hc"></p>
 <div class="btns"><a class="btn play" id="hp" target="_blank" rel="noopener">▶ Assistir no YouTube</a><a class="btn more" id="hm" href="#">ℹ Ver a categoria</a></div>
 <div class="stats" id="st"></div></div><div class="dots" id="dots"></div></section>
<main id="main"></main>
<div class="empty" id="empty">Nenhum vídeo encontrado para essa busca.</div>
<footer><div><b>Sunflix</b> · vídeos de estudo do Prof. Samuel Rocha – Biologia e Ciências · inspirado no material <b>Bioflix</b></div><div>Os vídeos abrem direto no YouTube. Categorias = playlists de estudo do canal @leumasrock.</div></footer>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt=id=>'https://www.youtube.com/watch?v='+id;
const th=(id,q='mqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`;
const main=document.getElementById('main'),chips=document.getElementById('chips');
let total=0;
D.cats.forEach(c=>{total+=c.videos.length;
 chips.insertAdjacentHTML('beforeend',`<a class="chip" href="#${c.slug}">${c.icon} ${esc(c.label)}</a>`);
 const ytl=c.playlist?`<a class="yt" href="https://www.youtube.com/playlist?list=${c.playlist}" target="_blank" rel="noopener">Abrir playlist no YouTube ↗</a>`:'';
 main.insertAdjacentHTML('beforeend',`<section class="row" id="${c.slug}" data-cat="${c.slug}"><h2>${c.icon} ${esc(c.label)} <small>${c.videos.length} vídeos${c.owner!=='Samuel Rocha'?' · '+esc(c.owner):''}</small>${ytl}</h2>
 <div class="track-wrap"><button class="arrow l" aria-label="Anterior">‹</button><div class="track">${c.videos.map((v,i)=>`<a class="card" href="${yt(v.id)}" target="_blank" rel="noopener" data-s="${esc((v.t+' '+v.c+' '+c.label).toLowerCase())}" title="${esc(v.t)}"><img class="th" loading="lazy" src="${th(v.id)}" alt=""><span class="num">${i+1}</span><span class="pl">▶</span><div class="meta"><div class="t">${esc(v.t)}</div><div class="c">${esc(v.c)}</div></div></a>`).join('')}</div><button class="arrow r" aria-label="Próximo">›</button></div></section>`);
});
chips.insertAdjacentHTML('beforeend',`<a class="chip" href="#material">📚 Material de apoio</a>`);
main.insertAdjacentHTML('beforeend',`<section class="row" id="material"><h2>📚 Material de apoio <small>notebooks e pastas do Drive (do PDF de acesso)</small></h2><div class="links">${D.links.map(l=>`<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic">${l.icon||'🔗'}</span><span>${esc(l.label)}<span class="s">${l.section==='notebooks'?'Notebook (NotebookLM)':'Pasta no Google Drive'}</span></span></a>`).join('')}</div></section>`);
document.querySelectorAll('.track-wrap').forEach(w=>{const t=w.querySelector('.track');
 w.querySelector('.l').onclick=()=>t.scrollBy({left:-t.clientWidth*.85});w.querySelector('.r').onclick=()=>t.scrollBy({left:t.clientWidth*.85});});
// hero
const feat=D.cats.filter(c=>c.videos.length).map(c=>({c,v:c.videos[Math.floor(Math.random()*c.videos.length)]}));
const A=document.getElementById('bgA'),B=document.getElementById('bgB'),dots=document.getElementById('dots');let cur=-1,front=A;
feat.forEach((_,i)=>{const d=document.createElement('i');d.onclick=()=>show(i,true);dots.appendChild(d)});
document.getElementById('st').innerHTML=`<span>🎬 ${total} vídeos</span><span>📂 ${D.cats.length} categorias</span><span>▶ abre no YouTube</span>`;
function show(i,user){cur=i;const {c,v}=feat[i];const back=front===A?B:A;
 const img=new Image();img.onload=()=>{back.style.backgroundImage=`url(${img.naturalWidth>200?img.src:th(v.id,'hqdefault')})`;back.classList.remove('on');back.style.opacity=1;front.style.opacity=0;requestAnimationFrame(()=>back.classList.add('on'));front=back};
 img.src=th(v.id,'maxresdefault');
 document.getElementById('hk').textContent=c.icon+' '+c.label;document.getElementById('ht').textContent=v.t;
 document.getElementById('hc').textContent=v.c?('Canal: '+v.c):'';document.getElementById('hp').href=yt(v.id);document.getElementById('hm').href='#'+c.slug;
 [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));if(user)restart()}
let timer;function restart(){clearInterval(timer);timer=setInterval(()=>show((cur+1)%feat.length),7000)}
show(0);restart();
addEventListener('scroll',()=>document.getElementById('hd').classList.toggle('solid',scrollY>40));
// busca
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let any=0;
 document.querySelectorAll('.row[data-cat]').forEach(r=>{let n=0;r.querySelectorAll('.card').forEach(c=>{const ok=!q||c.dataset.s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q);c.style.display=ok?'':'none';n+=ok});r.style.display=n?'':'none';any+=n});
 document.getElementById('material').style.display=q?'none':'';document.getElementById('hero').style.display=q?'none':'';main.style.marginTop=q?'80px':'';document.getElementById('empty').style.display=any?'none':'block'});
</script>
</body>
</html>
